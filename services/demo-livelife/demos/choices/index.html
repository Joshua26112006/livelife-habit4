<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit 4: Think Win-Win | AI Decoder Academy</title>
  <link rel="icon" href="shared/aida-mark.png">
  <link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="variants/theme.css">
  <link rel="stylesheet" href="variants/a.css">
</head>
<body>
  <div class="scene" aria-hidden="true"><i class="sky"></i><i class="sun"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="ground"></i><i class="haze"></i></div>
  <div class="page">
    <header class="top">
      <span class="brandline"><img class="mark" src="shared/aida-mark.png" alt="" width="26" height="31"><span data-aida="brand">AI Decoder Academy</span></span>
      <span class="tag"><span data-aida="level">Level 5</span><i aria-hidden="true"></i><span data-aida="habit">Habit 4: Think Win-Win</span></span>
    </header>
    <section class="intro">
      <h1><span data-aida="greeting">Welcome, coach</span>.</h1>
      <p data-aida="question">Where would you like to begin?</p>
    </section>
    <section class="pair" aria-label="Choose where to begin">
      <div class="stack">
        <a class="card glass c-self" data-go="self">
          <img class="art" src="shared/fluent/clipboard.webp" alt="" width="128" height="128">
          <span class="kicker">For you</span>
          <span class="title" data-aida="choices.0.title">Self assessment</span>
          <span class="body" data-aida="choices.0.body"></span>
          <span class="btn-primary"><span data-aida="choices.0.cta">Start assessment</span><i data-icon="arrow-right"></i></span>
        </a>
        <a class="btn-outcome" data-go="outcome"><span data-aida="choices.2.title">Assessment outcome</span><i data-icon="arrow-right"></i></a>
        <a class="btn-outcome" href="/adaptive"><span>Adaptive teaching engine</span><i data-icon="arrow-right"></i></a>
      </div>
      <a class="card glass c-class" data-go="class">
        <img class="art" src="shared/fluent/open-book.webp" alt="" width="128" height="128">
        <span class="kicker">For your class</span>
        <span class="title" data-aida="choices.1.title">Classroom content</span>
        <span class="body" data-aida="choices.1.body"></span>
        <span class="btn-primary"><span data-aida="choices.1.cta">Open content</span><i data-icon="arrow-right"></i></span>
      </a>
    </section>
  </div>
  <script src="shared/config.js"></script><script src="shared/icons.js"></script><script src="shared/choices.js"></script><script src="variants/variants.js"></script>
</body>
</html>
