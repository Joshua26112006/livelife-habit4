<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Decoder Academy | Teacher</title>
  <meta name="theme-color" content="#0a1a4a">
  <link rel="icon" href="shared/favicon.png">
  <link rel="preload" href="vendor/fonts/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="v2/style.css">
</head>
<body data-version="v2">
  <header class="bar">
    <a class="brand" href="./" aria-label="AI Decoder Academy home">
      <img src="shared/aida-logo.webp" alt="" width="34" height="34">
      <span data-aida="brand">AI Decoder Academy</span>
    </a>
    <div class="greet">
      <h1><span data-aida="greeting">Welcome, teacher</span>.</h1>
      <p data-aida="question">Where would you like to begin?</p>
    </div>
    <p class="tag"><span data-aida="level">Level 5</span><span aria-hidden="true">/</span><span data-aida="habit">Habit 4: Think Win-Win</span></p>
  </header>

  <main class="split" aria-label="Choose where to begin">
    <a class="side side-a" data-go="self">
      <span class="orbs" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="word" aria-hidden="true" data-aida="choices.0.short">Reflect</span>
      <span class="panel">
        <i class="panel-icon" data-icon="user-focus-light"></i>
        <span class="panel-title" data-aida="choices.0.title">Self assessment</span>
        <span class="panel-body" data-aida="choices.0.body"></span>
        <span class="panel-cta"><span data-aida="choices.0.cta">Start assessment</span><i data-icon="arrow-up-right"></i></span>
      </span>
    </a>
    <a class="side side-b" data-go="class">
      <span class="orbs" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="word" aria-hidden="true" data-aida="choices.1.short">Teach</span>
      <span class="panel">
        <i class="panel-icon" data-icon="presentation-chart-light"></i>
        <span class="panel-title" data-aida="choices.1.title">Classroom content</span>
        <span class="panel-body" data-aida="choices.1.body"></span>
        <span class="panel-cta"><span data-aida="choices.1.cta">Open content</span><i data-icon="arrow-up-right"></i></span>
      </span>
    </a>
  </main>

  <script src="shared/config.js"></script>
  <script src="shared/icons.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="shared/choices.js"></script>
  <script src="v2/app.js"></script>
</body>
</html>
