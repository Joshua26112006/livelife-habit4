<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Decoder Academy | Teacher</title>
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="shared/favicon.png">
  <link rel="preload" href="vendor/fonts/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="v5/style.css">
</head>
<body data-version="v5">
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="./" aria-label="AI Decoder Academy home">
      <img src="shared/aida-logo.webp" alt="" width="34" height="34">
      <span data-aida="brand">AI Decoder Academy</span>
    </a>
    <p class="tag"><span data-aida="level">Level 5</span>, <span data-aida="habit">Habit 4: Think Win-Win</span></p>
  </header>

  <main class="page">
    <div class="intro">
      <h1 class="hello"><span data-aida="greeting">Welcome, teacher</span>.</h1>
      <p class="ask" data-aida="question">Where would you like to begin?</p>
    </div>

    <nav class="rows" aria-label="Choose where to begin">
      <a class="row" data-go="self" data-lens="0">
        <span class="row-title"><span class="fill" data-aida="choices.0.title">Self assessment</span></span>
        <span class="row-side">
          <span class="row-body" data-aida="choices.0.body"></span>
          <span class="row-go" aria-hidden="true"><i data-icon="arrow-right"></i></span>
        </span>
      </a>
      <a class="row" data-go="class" data-lens="1">
        <span class="row-title"><span class="fill" data-aida="choices.1.title">Classroom content</span></span>
        <span class="row-side">
          <span class="row-body" data-aida="choices.1.body"></span>
          <span class="row-go" aria-hidden="true"><i data-icon="arrow-right"></i></span>
        </span>
      </a>
    </nav>
  </main>

  <!-- Glass lens that follows the cursor over a row (one backdrop layer). -->
  <div class="lens" aria-hidden="true">
    <div class="lens-track">
      <div class="lens-card">
        <i class="lens-ic" data-icon="user-focus-light"></i>
        <span class="lens-cta" data-aida="choices.0.cta">Start assessment</span>
        <span class="lens-note">Teacher reflection and action plan</span>
      </div>
      <div class="lens-card">
        <i class="lens-ic" data-icon="play-circle-light"></i>
        <span class="lens-cta" data-aida="choices.1.cta">Open content</span>
        <span class="lens-note">Slides, videos, scenarios</span>
      </div>
    </div>
  </div>

  <script src="shared/config.js"></script>
  <script src="shared/icons.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="shared/choices.js"></script>
  <script src="v5/app.js"></script>
</body>
</html>
