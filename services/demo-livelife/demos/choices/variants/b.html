<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit 4 | AI Decoder Academy</title>
  <link rel="icon" href="shared/aida-mark.png">
  <link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="variants/theme.css">
  <link rel="stylesheet" href="variants/b.css">
</head>
<body>
  <div class="scene" aria-hidden="true"><i class="sky"></i><i class="sun"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="ground"></i><i class="haze"></i></div>
  <main class="page">
    <section class="panel glass" aria-labelledby="q">
      <header class="head">
        <span class="app"><img src="shared/aida-mark.png" alt="AI Decoder Academy" width="28" height="33"></span>
        <span class="head-t"><span class="eyebrow" data-aida="programme">Discovering the Leader in Me</span><span class="habit" data-aida="habit">Habit 4: Think Win-Win</span></span>
        <span class="chip" data-aida="level">Level 5</span>
      </header>
      <div class="q">
        <p class="think"><img src="shared/fluent/waving-hand.webp" alt="" width="20" height="20"><span data-aida="greeting">Welcome, coach</span></p>
        <h1 id="q" data-aida="question">Where would you like to begin?</h1>
      </div>
      <div class="answers">
        <a class="ans" data-go="self">
          <span class="ltr" aria-hidden="true">A</span>
          <img src="shared/fluent/clipboard.webp" alt="" width="48" height="48">
          <span class="txt"><span class="t" data-aida="choices.0.title">Self assessment</span><span class="d" data-aida="choices.0.body"></span></span>
          <i class="chev" data-icon="arrow-right"></i>
        </a>
        <a class="ans" data-go="class">
          <span class="ltr" aria-hidden="true">B</span>
          <img src="shared/fluent/open-book.webp" alt="" width="48" height="48">
          <span class="txt"><span class="t" data-aida="choices.1.title">Classroom content</span><span class="d" data-aida="choices.1.body"></span></span>
          <i class="chev" data-icon="arrow-right"></i>
        </a>
      </div>
      <footer class="foot"><span>Pick the one you need right now.</span></footer>
    </section>
  </main>
  <script src="shared/config.js"></script><script src="shared/icons.js"></script><script src="shared/choices.js"></script><script src="variants/variants.js"></script>
</body>
</html>
