<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit 4 | AI Decoder Academy</title>
  <link rel="icon" href="shared/aida-mark.png">
  <link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="variants/theme.css">
  <link rel="stylesheet" href="variants/c.css">
</head>
<body>
  <div class="scene" aria-hidden="true"><i class="sky"></i><i class="sun"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="ground"></i><i class="haze"></i></div>
  <main class="page">
    <div class="board glass">
      <section class="tile hello">
        <span class="brandline"><img class="mark" src="shared/aida-mark.png" alt="" width="26" height="31"><span data-aida="brand">AI Decoder Academy</span></span>
        <img class="hand" src="shared/fluent/handshake.webp" alt="" width="220" height="220">
        <div>
          <p class="eyebrow" data-aida="habit">Habit 4: Think Win-Win</p>
          <h1><span data-aida="greeting">Welcome, coach</span>.</h1>
          <p class="ask" data-aida="question">Where would you like to begin?</p>
        </div>
      </section>
      <a class="tile pick p-self" data-go="self">
        <img src="shared/fluent/clipboard.webp" alt="" width="64" height="64">
        <span class="t" data-aida="choices.0.title">Self assessment</span>
        <span class="d" data-aida="choices.0.body"></span>
        <span class="go"><span data-aida="choices.0.cta">Start assessment</span><i data-icon="arrow-up-right"></i></span>
      </a>
      <a class="tile pick p-class" data-go="class">
        <img src="shared/fluent/open-book.webp" alt="" width="64" height="64">
        <span class="t" data-aida="choices.1.title">Classroom content</span>
        <span class="d" data-aida="choices.1.body"></span>
        <span class="go"><span data-aida="choices.1.cta">Open content</span><i data-icon="arrow-up-right"></i></span>
      </a>
      <div class="tile fact"><b data-aida="level">Level 5</b><span>Discovering the Leader in Me</span></div>
      <div class="tile fact"><b>58 min</b><span>suggested session</span></div>
      <div class="tile fact"><b>3 phases</b><span>Engagement, Understanding, Retention</span></div>
    </div>
  </main>
  <script src="shared/config.js"></script><script src="shared/icons.js"></script><script src="shared/choices.js"></script><script src="variants/variants.js"></script>
</body>
</html>
