<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit 4 | AI Decoder Academy</title>
  <link rel="icon" href="shared/aida-mark.png">
  <link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="variants/theme.css">
  <link rel="stylesheet" href="variants/d.css">
</head>
<body>
  <div class="scene" aria-hidden="true"><i class="sky"></i><i class="sun"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="ground"></i><i class="haze"></i></div>
  <main class="page">
    <header class="top">
      <span class="brandline"><img class="mark" src="shared/aida-mark.png" alt="" width="26" height="31"><span data-aida="brand">AI Decoder Academy</span></span>
      <h1><span data-aida="greeting">Welcome, coach</span>.</h1>
      <p data-aida="question">Where would you like to begin?</p>
    </header>

    <div class="seg glass" role="tablist" aria-label="Choose where to begin">
      <span class="knob" aria-hidden="true"></span>
      <button role="tab" id="tab-self" aria-selected="true" aria-controls="stage" data-pick="0"><img src="shared/fluent/clipboard.webp" alt="" width="24" height="24"><span data-aida="choices.0.title">Self assessment</span></button>
      <button role="tab" id="tab-class" aria-selected="false" aria-controls="stage" data-pick="1"><img src="shared/fluent/open-book.webp" alt="" width="24" height="24"><span data-aida="choices.1.title">Classroom content</span></button>
    </div>

    <section id="stage" class="stage glass" role="tabpanel" aria-labelledby="tab-self">
      <div class="art"><img id="art" src="shared/fluent/clipboard.webp" alt="" width="200" height="200"></div>
      <div class="copy">
        <p class="kick" id="kick">For you</p>
        <h2 id="title">Self assessment</h2>
        <p class="body" id="body"></p>
        <ul class="list" id="list"></ul>
        <div class="actions">
          <a class="btn-primary" id="go" data-go="self"><span id="cta">Start assessment</span><i data-icon="arrow-right"></i></a>
          <a class="alt" id="alt" data-go="class">Or open <span id="alt-t">Classroom content</span></a>
        </div>
      </div>
    </section>
    <p class="meta"><span data-aida="level">Level 5</span>, <span data-aida="habit">Habit 4: Think Win-Win</span></p>
  </main>
  <script src="shared/config.js"></script><script src="shared/icons.js"></script><script src="shared/choices.js"></script><script src="variants/variants.js"></script>
  <script>
    // Segmented switch: preview each choice before continuing. Content comes from shared/config.js.
    (function () {
      const A = window.AIDA, reduce = window.AIDA_REDUCE;
      const extra = [
        { kick: "For you", art: "shared/fluent/clipboard.webp", items: ["8 real classroom situations", "Scores for each competency", "A coaching plan for your next class"] },
        { kick: "For your class", art: "shared/fluent/open-book.webp", items: ["Engagement, Understanding, Retention", "Lesson blog and short video", "Quick checks for your students"] },
      ];
      const $ = (id) => document.getElementById(id);
      const tabs = [...document.querySelectorAll("[data-pick]")];
      const stage = $("stage");
      function show(i, animate) {
        const c = A.choices[i], x = extra[i];
        tabs.forEach((t, k) => t.setAttribute("aria-selected", String(k === i)));
        document.querySelector(".seg").dataset.on = String(i);
        stage.setAttribute("aria-labelledby", tabs[i].id);
        const fill = () => {
          $("kick").textContent = x.kick; $("title").textContent = c.title; $("body").textContent = c.body;
          $("cta").textContent = c.cta; $("art").src = x.art;
          $("list").replaceChildren(...x.items.map((t) => Object.assign(document.createElement("li"), { textContent: t })));
          const go = $("go"); go.dataset.go = c.id; go.setAttribute("href", c.href);
          const o = A.choices[1 - i], alt = $("alt"); alt.dataset.go = o.id; alt.setAttribute("href", o.href); $("alt-t").textContent = o.title;
          stage.dataset.on = String(i);
        };
        if (!animate || reduce) return fill();
        stage.classList.add("swap");
        setTimeout(() => { fill(); stage.classList.remove("swap"); }, 150);
      }
      tabs.forEach((t, i) => t.addEventListener("click", () => show(i, true)));
      document.querySelector(".seg").addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        const i = tabs.findIndex((t) => t.getAttribute("aria-selected") === "true") === 0 ? 1 : 0;
        tabs[i].focus(); show(i, true);
      });
      show(0, false);
    })();
  </script>
</body>
</html>
