<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Decoder Academy | Teacher</title>
  <meta name="theme-color" content="#dfe8ff">
  <link rel="icon" href="shared/favicon.png">
  <link rel="preload" href="vendor/fonts/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="v4/style.css">
</head>
<body data-version="v4">
  <div class="env" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="floor"></i></div>

  <main class="space">
    <div class="window-wrap">
      <section class="window" aria-label="Choose where to begin">
        <div class="w-head">
          <img src="shared/aida-logo.webp" alt="" width="44" height="44">
          <div>
            <p class="w-brand" data-aida="brand">AI Decoder Academy</p>
            <h1 class="hello"><span data-aida="greeting">Welcome, teacher</span>.</h1>
            <p class="ask" data-aida="question">Where would you like to begin?</p>
          </div>
        </div>

        <div class="tiles">
          <a class="tile" data-go="self">
            <span class="spot" aria-hidden="true"></span>
            <span class="tile-top">
              <i class="tile-ic" data-icon="user-focus-fill"></i>
              <span class="go" aria-hidden="true"><i data-icon="arrow-up-right"></i></span>
            </span>
            <span class="tile-title" data-aida="choices.0.title">Self assessment</span>
            <span class="tile-body" data-aida="choices.0.body"></span>
            <span class="sr-only" data-aida="choices.0.cta"></span>
          </a>
          <a class="tile" data-go="class">
            <span class="spot" aria-hidden="true"></span>
            <span class="tile-top">
              <i class="tile-ic" data-icon="presentation-chart-fill"></i>
              <span class="go" aria-hidden="true"><i data-icon="arrow-up-right"></i></span>
            </span>
            <span class="tile-title" data-aida="choices.1.title">Classroom content</span>
            <span class="tile-body" data-aida="choices.1.body"></span>
            <span class="sr-only" data-aida="choices.1.cta"></span>
          </a>
        </div>
      </section>
      <span class="grab" aria-hidden="true"></span>
    </div>

    <p class="ornament"><i data-icon="handshake-light"></i><span data-aida="level">Level 5</span><span class="sep" aria-hidden="true"></span><span data-aida="habit">Habit 4: Think Win-Win</span></p>
  </main>

  <script src="shared/config.js"></script>
  <script src="shared/icons.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="shared/choices.js"></script>
  <script src="v4/app.js"></script>
</body>
</html>
