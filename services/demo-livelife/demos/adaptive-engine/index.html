<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How We Find and Fix Misconceptions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Sora:wght@600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f4f7; --surface: #ffffff; --ink: #141c28; --muted: #5a6575; --line: #dbe1e9; --accent: #1d5c88; --accent-soft: #e1ecf5;
  --secure: #1f7a4d; --shown: #86c4a0; --slip: #e3b23c; --wrong: #c8503a; --wrong-soft: #f9e3dd; --teach: #7d8ca3; --blank: #bcc3cd;
  --content: #1d5c88; --teacher: #7a4fb0; --student: #b4610e; --paper: #fffdf5; --paper-line: #ebe5d1; --pencil: #22314a;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif; --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --font-hand: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151d; --surface: #17202b; --ink: #e7ecf3; --muted: #9ca8b8; --line: #2a3546; --accent: #74b4df; --accent-soft: #1c3245;
  --secure: #4cbf83; --shown: #3e7d5a; --slip: #cfa035; --wrong: #e6765d; --wrong-soft: #3a2420; --teach: #6f7f96; --blank: #4a5465;
  --content: #74b4df; --teacher: #b698ec; --student: #f0a75a; --paper: #1f2733; --paper-line: #343e4e; --pencil: #e0e7f1; color-scheme: dark; } }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 70px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; } h2 { font-size: clamp(22px, 3vw, 30px); line-height: 1.2; } h3 { font-size: 17px; }
p { margin: 0; } .muted { color: var(--muted); } .small { font-size: 13px; } .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hand { font-family: var(--font-hand); font-size: 24px; line-height: 1.15; color: var(--pencil); overflow-wrap: anywhere; }
nav.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
nav .in { max-width: 1120px; margin: 0 auto; padding: 10px 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
nav a { font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: 999px; }
nav a.on { background: var(--accent); color: #fff; } nav .sp { flex: 1; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, .btn { font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; text-decoration: none; display: inline-block; }
button.pri { background: var(--accent); color: #fff; border-color: var(--accent); } button.tiny { padding: 2px 9px; font-size: 13px; } button:disabled { opacity: .5; cursor: not-allowed; }
select, input[type=text] { font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
main { max-width: 1120px; margin: 0 auto; padding: 0 18px 60px; }
section.ch { padding: 40px 0 28px; border-bottom: 1px solid var(--line); display: grid; gap: 22px; } section.ch:last-of-type { border-bottom: 0; }
.chead { display: grid; gap: 8px; max-width: 760px; } .step { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: .04em; } .say { font-size: 18px; color: var(--muted); }
.hero { padding: 36px 0 30px; display: grid; gap: 18px; border-bottom: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; } .tile b { font-family: var(--font-display); font-size: 32px; line-height: 1.1; }
.loop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .loop .s { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.loop .s.done { color: var(--secure); border-color: var(--secure); } .loop .s.now { background: var(--accent); border-color: var(--accent); color: #fff; } .loop .a { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.badge { justify-self: start; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.badge.easy { background: color-mix(in srgb, var(--secure) 18%, transparent); color: var(--secure); } .badge.hard { background: var(--wrong-soft); color: var(--wrong); }
.panel svg { height: 88px; width: auto; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; } .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.qview { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; } @media (max-width: 860px) { .qview { grid-template-columns: 1fr; } }
.waffle { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; } .waffle i { aspect-ratio: 1; border-radius: 50%; display: block; transition: opacity .15s; } .waffle i.dim { opacity: .2; }
.big { font-family: var(--font-display); font-size: 40px; line-height: 1; } .legend { display: grid; gap: 6px; font-size: 13px; } .legend span { display: flex; gap: 8px; align-items: center; } .sw { width: 13px; height: 13px; border-radius: 50%; display: inline-block; flex: none; }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.sheet { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 10px; padding: 10px 14px 12px; display: grid; gap: 6px; border-top: 5px solid var(--c, var(--line)); align-content: start; }
.sheet .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); } .sheet .think { font-size: 14px; background: var(--surface); border-radius: 6px; padding: 6px 8px; border: 1px solid var(--line); }
.sheet:hover, .sheet:focus-within { box-shadow: 0 0 0 2px var(--c); }
.callout { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15px; }
.note { border-left: 4px solid var(--slip); background: color-mix(in srgb, var(--slip) 14%, transparent); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; } .pct { display: flex; align-items: baseline; gap: 8px; } .pct b { font-family: var(--font-display); font-size: 34px; color: var(--wrong); line-height: 1; } .gap .pct b { color: var(--slip); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .bar div { height: 100%; background: var(--wrong); } .gap .bar div { background: var(--slip); } .ex { font-size: 14px; border-left: 3px solid var(--wrong); padding-left: 8px; } .gap .ex { border-color: var(--slip); }
.rule { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; align-items: center; } .rule .r { padding: 5px 10px; border-radius: 999px; color: #fff; font-weight: 500; }
.owners { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } @media (max-width: 860px) { .owners { grid-template-columns: 1fr; } }
.own { border-top: 6px solid var(--oc); } .own h3 { color: var(--oc); display: flex; justify-content: space-between; gap: 8px; } .act { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; } .tag { font-size: 12px; font-weight: 600; color: var(--muted); } .gaps { color: var(--muted); font-style: italic; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 14px; } tr:last-child td { border-bottom: 0; } th { font-size: 12px; color: var(--muted); font-weight: 600; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; } details { margin: 2px 0; } ul.t, ol.t { margin: 6px 0; padding-left: 20px; font-size: 14px; }
.ba { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } @media (max-width: 960px) { .ba { grid-template-columns: 1fr; } }
.vrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; } .chip { border-radius: 8px; padding: 3px 9px; font-size: 13px; font-weight: 600; color: #fff; display: inline-block; } .chip.t { background: transparent; color: var(--secure); border: 2px dashed var(--secure); }
.who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); } .who select { font-size: 13px; padding: 3px 6px; max-width: 100%; } .mgrid .who select { width: 100%; }
.draft { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--slip) 22%, transparent); color: var(--ink); white-space: nowrap; }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; align-items: center; font-size: 14px; } .two { display: grid; gap: 3px; } .two div { height: 9px; border-radius: 4px; } .two .a { background: var(--wrong); } .two .b { background: var(--secure); }
#busy { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 9; display: none; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 14px; }
#error { display: none; max-width: 1084px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--wrong); color: var(--wrong); background: var(--wrong-soft); }
footer { max-width: 1120px; margin: 0 auto; padding: 0 18px 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<nav class="bar" aria-label="Chapters"><div class="in" id="nav"></div></nav>
<div id="error" role="alert"></div>
<div id="busy" role="status"></div>
<main id="app"></main>
<footer id="foot"></footer>
<script>
const API = "api";
const ORDER = ["created","paper_set","uploaded","keyed","read","identified","mapped","grouped","planned","approved","paper_ready","v2_uploaded","scored","profiled"];
const COLORS = { secure: "--secure", shown: "--shown", slip: "--slip", wrong: "--wrong", teacher: "--teach", blank: "--blank" };
const LABELS = { secure: "Correct, method shown", shown: "Correct, no working", slip: "Slip or missing fact", wrong: "Thinking error", teacher: "For the teacher", blank: "Left blank" };
const OWNER = { content: ["Our content", "--content"], teacher: ["Teacher", "--teacher"], student: ["Student", "--student"] };
const OWNER_SETS = [["auto","By how many students have it"],["content,teacher,student","Our content, teacher and student"],["teacher,student","Teacher and student"],["teacher","Teacher only"],["student","Student only"]];
const seenOnce = level => level === "candidate" ? ' <span class="muted small">(seen once)</span>' : "";
let C = null, SUBJECTS = {}, tab = 0, who = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");
const color = l => `var(${COLORS[l] || "--line"})`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const reached = s => C && ORDER.indexOf(C.stage) >= ORDER.indexOf(s);
const table = (cols, rows) => `<div class="scroll"><table><thead><tr>${cols.map(c => `<th scope="col">${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const subjectLine = m => `${m.subject.subject}, ${m.subject.grade}: ${m.subject.chapter}`;
const nameOf = c => C.subject_map.misconceptions[c]?.name || c;

async function call(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "That step failed. Is the service running?");
  return body;
}
const json = body => ({ method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
const post = (path, body) => call(`${API}/classes/${C.class_id}/${path}`, json(body));
const module_ = route => call(`/api/adaptive/${route}`, json({ classId: C.class_id }));
function showError(message) { $("error").textContent = message; $("error").style.display = "block"; }
async function step(message, fn) {
  $("error").style.display = "none"; $("busy").textContent = message; $("busy").style.display = "block";
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await fn(); await refresh(); } catch (e) { showError(e.message); render(); } finally { $("busy").style.display = "none"; }
}
async function refresh() { if (C) C = await call(`${API}/classes/${C.class_id}`); render(); }

// Each action runs the modules behind it, so the teacher sees steps, not modules.
// An uploaded paper: work out missing answers, mark the working, name the thinking errors. A subject pack: one step.
const fromKey = async () => { await module_("read-answers"); await fromRead(); };
const fromRead = async () => { await module_("thinking-errors"); await module_("insights").catch(() => {}); };
// Answers the AI worked out are shown to the teacher before any marking; a paper that brought all its answers goes straight on.
const analyse = async () => { if (C.generic) { const k = await module_("answer-key"); if (k.paper.some(p => !p.answer || p.answer_source === "ai")) return; await fromKey(); } else { await module_("identify"); await module_("insights").catch(() => {}); } };
async function confirmKey() {
  const changed = {}; (C.paper || []).forEach(p => { const v = $(`key-${p.id}`)?.value.trim(); if (v && v !== p.answer) changed[p.id] = v; });
  if ((C.paper || []).some(p => !p.answer && !changed[p.id])) throw new Error("Every question needs an expected answer before marking.");
  if (Object.keys(changed).length) await post("answers", { answers: changed });
  await fromKey();
}
const ACTIONS = {
  uploaded: ["Analyse the class", "Reading every student's answers…", analyse],
  keyed: ["Answers are right: mark the class", "Reading every student's answers…", confirmKey],
  read: ["Continue the analysis", "Naming the thinking errors…", fromRead],
  identified: ["Find the fixes and form groups", "Matching fixes and forming groups…", async () => { await module_("interventions"); await module_("clusters"); }],
  mapped: ["Form groups", "Forming groups…", () => module_("clusters")],
  grouped: ["Build the teaching plan", "Drafting the plan and materials…", () => module_("instruction")],
  planned: ["Approve the plan", "Approving…", () => post("plan/approve", {})],
  approved: ["Create the re-test paper", "Creating and checking version 2…", () => module_("reassessment-paper")],
  v2_uploaded: ["Compare version 1 and 2", "Reading version 2 and comparing…", async () => { await module_("reassessment-score"); await module_("profile"); }],
  scored: ["Update student profiles", "Updating profiles…", () => module_("profile")],
};
// No re-test for an uploaded paper yet.
const actionNow = () => C.generic && ["approved","paper_ready","v2_uploaded","scored"].includes(C.stage) ? null : ACTIONS[C.stage];
function act() { const a = actionNow(); if (a) step(a[1], a[2]); }

async function createClass() {
  const pack = $("pack").value, name = $("name").value.trim() || "My class";
  await step("Creating the class…", async () => {
    C = { class_id: (await call(`${API}/classes`, json({ pack, name }))).class_id };
    history.replaceState(null, "", `?class=${C.class_id}`);
  });
}
async function uploadBytes(round, body, filename) {
  await step(round === "v1" ? "Reading every student's answers…" : "Reading version 2 and comparing…", async () => {
    await call(`${API}/classes/${C.class_id}/upload/${round}?filename=${encodeURIComponent(filename)}`, { method: "POST", body });
    if (round === "v1") await analyse();
    else { await module_("reassessment-score"); await module_("profile"); }
  });
}
function uploadFile(round) { const f = $(`file-${round}`).files[0]; if (f) uploadBytes(round, f, f.name); else showError("Choose a file first."); }
async function uploadPaper(body) {
  await step("Reading the question paper…", () => call(`${API}/classes/${C.class_id}/paper`, { method: "POST", body }));
}
function uploadPaperFile() { const f = $("file-paper").files[0]; if (f) uploadPaper(f); else showError("Choose the question paper first."); }
async function useSamplePaper() { uploadPaper(await (await fetch(`${API}/files/generic/paper?sample=true`)).text()); }
async function useSample(round) { uploadBytes(round, await (await fetch(`${API}/files/${C.pack}/${round}?sample=true`)).text(), "sample.csv"); }
const probe = (student, code, outcome) => step("Saving the follow-up result…", () => post("probes", { student, code, outcome }));
const move = (student, from_group, to_group) => to_group && step("Moving the student…", () => post("groups/move", { student, from_group, to_group, rationale: "Teacher edit" }));
function raise(i) { const ids = C.feeds.m5.groups.filter(g => g.delivery === "teacher").map(g => g.group_id); [ids[i-1], ids[i]] = [ids[i], ids[i-1]]; const rest = C.feeds.m5.groups.filter(g => g.delivery !== "teacher").map(g => g.group_id); step("Changing the order…", () => post("groups/priority", { group_ids: [...ids, ...rest] })); }
const saveRules = (o, msg) => step(msg || "Applying the new rules…", () => post("settings", { policy: o }));
function setOwner(code, value) {
  const owners = { ...(C.policy_overrides.owners || {}) };
  if (value === "auto") { if (C.subject_map.policy.owners[code]) owners[code] = "auto"; else delete owners[code]; } else owners[code] = value.split(",");
  const o = { ...C.policy_overrides, owners }; if (!Object.keys(owners).length) delete o.owners;
  saveRules(o, "Changing who fixes it…");
}
function applyRules() {
  const base = C.subject_map.policy, o = { ...C.policy_overrides };
  const set = (k, v) => { if (v === base[k]) delete o[k]; else o[k] = v; };
  set("group_from", $("r-group").value); set("content_share", Number($("r-content").value)); set("teacher_share", Number($("r-teacher").value));
  saveRules(o);
}
function pickTab(i) { tab = i; drawAnswers(); }
function pickStudent(v) { who = v; $("one").innerHTML = oneStudent(); }

// ---- pictures for familiar question types
const ICONS = {
  card: '<svg viewBox="0 0 140 90" role="img" aria-label="A playing card"><rect x="40" y="4" width="60" height="82" rx="7" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="48" y="22" font-size="15" font-weight="700" fill="#c0392b">K</text><text x="70" y="56" font-size="26" fill="#c0392b" text-anchor="middle">♥</text><text x="92" y="80" font-size="15" font-weight="700" fill="#c0392b" text-anchor="end">K</text></svg>',
  coins: '<svg viewBox="0 0 160 90" role="img" aria-label="Two coins"><circle cx="52" cy="42" r="30" fill="#d9a441" stroke="var(--ink)" stroke-width="2"/><text x="52" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#5a3e0c">H</text><circle cx="112" cy="42" r="30" fill="#d9a441" stroke="var(--ink)" stroke-width="2"/><text x="112" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#5a3e0c">T</text></svg>',
  dice: '<svg viewBox="0 0 160 90" role="img" aria-label="Two dice"><rect x="22" y="14" width="56" height="56" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><g fill="var(--ink)"><circle cx="38" cy="28" r="4.5"/><circle cx="38" cy="42" r="4.5"/><circle cx="38" cy="56" r="4.5"/><circle cx="62" cy="28" r="4.5"/><circle cx="62" cy="42" r="4.5"/><circle cx="62" cy="56" r="4.5"/></g><rect x="92" y="14" width="56" height="56" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><g fill="var(--ink)"><circle cx="106" cy="28" r="4.5"/><circle cx="120" cy="42" r="4.5"/><circle cx="134" cy="56" r="4.5"/></g></svg>',
};
const chapter = (id, n, title, say, body) => `<section class="ch" id="${id}"><div class="chead"><span class="step">${n}</span><h2>${title}</h2><p class="say">${say}</p></div>${body}</section>`;
const LOOP = [["Short test","created"],["Answers uploaded","uploaded"],["How each answer was solved","identified"],["Thinking errors found","identified"],["Fixes: student, teacher, our content","grouped"],["Teaching plan","approved"],["Re-test","scored"]];

function viewNew() {
  $("nav").innerHTML = ""; $("foot").textContent = "";
  $("app").innerHTML = `<div class="hero"><span class="step">AI Decoder · Adaptive Teaching Engine</span><h1>We read how every student solved each question, find the thinking error behind each wrong answer, and send it to whoever can fix it.</h1>
  <div class="panel"><h3>Start with a class</h3><div class="row"><select id="pack" aria-label="Subject" onchange="showSubject()"><option value="generic">Any subject: upload your question paper</option>${Object.entries(SUBJECTS).map(([k,m]) => `<option value="${esc(k)}">${esc(subjectLine(m))}</option>`).join("")}</select><input type="text" id="name" placeholder="Class name" aria-label="Class name" maxlength="60"><button class="pri" onclick="createClass()">Create class</button></div><div id="preview" class="small muted"></div><p class="small muted">Use synthetic data for now: this demo has no sign-in.</p></div></div>`;
  showSubject();
}

  return chapter("student","7 · ONE STUDENT","One student: version 1, the plan, version 2","Pick a student to follow them through.", `<div class="row"><label class="small" for="pick">Student</label><select id="pick" onchange="pickStudent(this.value)">${f.students.map(s => `<option ${s.student === who ? "selected" : ""}>${esc(s.student)}</option>`).join("")}</select></div><div class="ba" id="one">${oneStudent()}</div>`);
}
function viewSystem() {
  if (!C.subject_map) return "";
  const f = C.feeds, m = C.subject_map, status = v => v ? ({ ok: "AI applied", partial: "AI partly applied", failed: "Rules only (AI failed)", off: "Rules only (AI off)" }[v] || v) : "Not run";
  const rows = [["3 Misconception identification","/api/adaptive/identify, /insights",f.m3?.ai],["4 Intervention mapping","/api/adaptive/interventions",f.m4?.ai],["5 Student clustering","/api/adaptive/clusters",f.m5?.ai],["6 Differentiated instruction","/api/adaptive/instruction",f.m6?.ai],["7 Reassessment","/api/adaptive/reassessment-paper, /reassessment-score",f["m7-score"]?.ai||f["m7-paper"]?.ai],["8 Profiles and next action","/api/adaptive/profile",f.m8?.ai]];
  return `<section class="ch" id="system"><details><summary>Subject map and system details</summary><p class="small" style="margin:8px 0"><b>${esc(subjectLine(m))}</b> (${esc(m.subject.board)}; ${esc(m.subject.source)}). ${m.interventions.approved} of ${m.interventions.total} interventions expert-approved.</p>${table(["Module","API","Status"], rows.map(r => [r[0], `<span class="num small">${r[1]}</span>`, status(r[2])]))}<br>${table(["Competency","Name"], Object.entries(m.competencies).map(([k,c]) => [esc(k), esc(c.name)]))}<br>${table(["Error pattern","Belief","Kind"], Object.entries(m.misconceptions).map(([k,c]) => [esc(c.name), esc(c.belief), esc(c.kind)]))}${f.m8 ? `<p class="small muted" style="margin-top:8px">Audit trail: ${plural(f.m8.audit.length,"recorded event")}.</p>` : ""}</details></section>`;
}
function render() {
  if (!C?.stage) return viewNew();
  const parts = [["top","Overview",1],["test","1 The test",C.feeds.m3],["answers","2 What students wrote",C.feeds.m3],["reveals","3 What it reveals",C.feeds.m3],["fixes","4 Who fixes it",C.feeds.m3],["plan","5 The plan",C.feeds.m5],["retest","6 Re-test",C.feeds["m7-paper"]],["student","7 One student",C.feeds.m3]].filter(x => x[2]);
  const a = actionNow();
  $("nav").innerHTML = parts.map(([id,l]) => `<a href="#${id}">${l}</a>`).join("") + `<span class="sp"></span>${a ? `<button class="pri" onclick="act()">${a[0]} →</button>` : ""}`;
  $("app").innerHTML = viewHero() + viewTest() + viewAnswers() + viewReveals() + viewFixes() + viewPlan() + viewRetest() + viewOne() + viewSystem();
  $("foot").textContent = `The routing thresholds (${C.policy.content_share}% and ${C.policy.teacher_share}%) are our proposal,` + " to be calibrated on real classes. Interventions are unreviewed drafts until a subject expert approves them. Bookmark this page to return to this class.";
  drawAnswers(); mark();
}
function mark() { let on = 0; const links = [...document.querySelectorAll("nav a")]; links.forEach((l,i) => { const el = document.querySelector(l.getAttribute("href")); if (el && el.getBoundingClientRect().top <= 90) on = i; }); links.forEach((l,i) => l.classList.toggle("on", i === on)); }
window.addEventListener("scroll", mark, { passive: true });
(async () => {

  const id = new URLSearchParams(location.search).get("class");
  if (id) { C = { class_id: id }; try { await refresh(); return; } catch { C = null; showError("That class was not found."); } }
  render();
})();
